name: Validate publisher
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 tools/tap.py validate
      - run: python3 -m unittest discover -s tests -v
  formulae:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Homebrew Ruby syntax
        run: |
          python3 - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          import tap
          out = Path(os.environ["RUNNER_TEMP"]) / "fixture-formulae"
          out.mkdir()
          for name, meta in tap.public_project("tools")["packages"].items():
              hashes = {tap.asset_name(name, "1.2.3", t): "0" * 64 for t in tap.BREW_TARGETS}
              (out / (name + ".rb")).write_text(tap.formula(name, "1.2.3", meta, hashes, tap.BREW_TARGETS, "xuniv/homebrew-tap"))
          PY
          for formula in "$RUNNER_TEMP/fixture-formulae/"*.rb; do
            ruby -c "$formula"
          done
      - name: Load generated formulae in Homebrew for every desktop OS and CPU
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euo pipefail
          brew trust --tap xuniv/tap
          brew tap xuniv/tap
          mkdir -p "$(brew --repository xuniv/tap)/Formula"
          cp "$RUNNER_TEMP/fixture-formulae/"*.rb "$(brew --repository xuniv/tap)/Formula/"
          brew readall --os=all --arch=all xuniv/tap 2>&1 | tee "$RUNNER_TEMP/readall.log"
          python3 - <<'PY'
          import os
          from pathlib import Path
          log = (Path(os.environ["RUNNER_TEMP"]) / "readall.log").read_text().lower()
          if "not trusted" in log or "untrusted tap" in log:
              raise SystemExit("Homebrew skipped untrusted formulae")
          PY
