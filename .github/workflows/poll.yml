name: Check registered manifests
on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: tap-poll
  cancel-in-progress: false
jobs:
  projects:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      projects: ${{ steps.list.outputs.projects }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("projects=" + json.dumps(sorted(p.stem for p in Path("packages").glob("*.json"))) + "\n")
          PY
  poll:
    if: github.ref == 'refs/heads/main'
    needs: projects
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.projects.outputs.projects) }}
    environment:
      name: tap-${{ matrix.project }}
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install encryption tool
        run: sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq age >/dev/null
      - name: Check private manifests without printing source data
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_SOURCE: ${{ secrets.TAP_SOURCE }}
          TAP_KEY: ${{ secrets.TAP_KEY }}
          TAP_LOCK_RECIPIENT: ${{ vars.TAP_LOCK_RECIPIENT }}
          TAP_LOG_RECIPIENT: ${{ vars.TAP_LOG_RECIPIENT }}
          PROJECT: ${{ matrix.project }}
        run: python3 tools/tap.py poll --project "$PROJECT" --out "$RUNNER_TEMP/sealed"
      - name: Preserve encrypted diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diag-poll-${{ matrix.project }}
          path: ${{ runner.temp }}/sealed/diag/*.age
          if-no-files-found: ignore
          retention-days: 3
